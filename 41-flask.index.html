<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Routes · Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e1a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            background: #111827;
            border-radius: 32px;
            padding: 2.8rem 3rem 3.2rem;
            border: 1px solid #1f2937;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #1f2937;
        }

        .header-left h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #f9fafb;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left h1 i {
            color: #60a5fa;
            opacity: 0.3;
        }

        .header-left h1 .tag {
            font-size: 0.6rem;
            font-weight: 500;
            background: #1f2937;
            color: #9ca3af;
            padding: 0.2rem 1rem;
            border-radius: 30px;
        }

        .header-left .subtitle {
            display: flex;
            gap: 10px;
            margin-top: 0.3rem;
        }

        .header-left .subtitle span {
            background: #1f2937;
            padding: 0.15rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #6b7280;
        }

        .header-right {
            display: flex;
            gap: 12px;
        }

        .header-right .badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0.4rem 1.2rem;
            background: #1f2937;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #9ca3af;
            border: 1px solid #374151;
        }

        .badge .val {
            font-weight: 600;
            color: #f9fafb;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .stat {
            background: #1f2937;
            border-radius: 16px;
            padding: 1.2rem 1rem;
            border: 1px solid #374151;
            text-align: center;
            transition: 0.2s;
        }

        .stat:hover {
            transform: translateY(-2px);
            border-color: #60a5fa;
        }

        .stat .num {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f9fafb;
        }

        .stat .num.blue { color: #60a5fa; }
        .stat .num.green { color: #34d399; }
        .stat .num.orange { color: #fbbf24; }
        .stat .num.purple { color: #a78bfa; }

        .stat .label {
            font-size: 0.6rem;
            color: #6b7280;
            text-transform: uppercase;
            margin-top: 0.1rem;
            letter-spacing: 0.3px;
        }

        .routes-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .route-card {
            background: #1f2937;
            border-radius: 16px;
            padding: 1.2rem 1rem;
            border: 1px solid #374151;
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;
        }

        .route-card:hover {
            transform: translateY(-3px);
            border-color: #60a5fa;
            box-shadow: 0 8px 25px rgba(96, 165, 250, 0.05);
        }

        .route-card.active {
            border-color: #60a5fa;
            background: rgba(96, 165, 250, 0.05);
        }

        .route-card .number {
            font-size: 0.55rem;
            font-weight: 600;
            color: #6b7280;
            font-family: 'Courier New', monospace;
            margin-bottom: 0.3rem;
        }

        .route-card .icon {
            font-size: 1.6rem;
            color: #60a5fa;
            opacity: 0.15;
            margin-bottom: 0.4rem;
        }

        .route-card:hover .icon {
            opacity: 0.3;
        }

        .route-card .name {
            font-size: 0.75rem;
            font-weight: 600;
            color: #f9fafb;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }

        .route-card .path {
            font-size: 0.55rem;
            color: #6b7280;
            margin-top: 0.2rem;
            font-family: 'Courier New', monospace;
        }

        .route-card .status {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.1rem 0.6rem;
            border-radius: 20px;
            font-size: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            background: rgba(52, 211, 153, 0.05);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.05);
        }

        .route-details {
            background: #1f2937;
            border-radius: 20px;
            padding: 2rem 2.5rem;
            border: 1px solid #374151;
            margin-bottom: 2.5rem;
            min-height: 120px;
        }

        .route-details .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid #374151;
            margin-bottom: 1.2rem;
        }

        .route-details .head .lbl {
            font-size: 0.65rem;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .route-details .head .meta {
            font-size: 0.6rem;
            color: #6b7280;
        }

        .route-details .route-display {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .route-details .route-display .method {
            font-size: 0.7rem;
            font-weight: 700;
            color: #34d399;
            padding: 0.3rem 1rem;
            border: 1px solid rgba(52, 211, 153, 0.05);
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            background: rgba(52, 211, 153, 0.02);
        }

        .route-details .route-display .url {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f9fafb;
            font-family: 'Courier New', monospace;
        }

        .route-details .route-display .response {
            font-size: 0.85rem;
            color: #9ca3af;
            font-family: 'Courier New', monospace;
            background: #111827;
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            border: 1px solid #374151;
            flex: 1;
            min-width: 200px;
            min-height: 40px;
            display: flex;
            align-items: center;
            word-break: break-word;
        }

        .route-details .route-display .response .response-text {
            color: #f9fafb;
            font-weight: 400;
        }

        .footer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
        }

        .footer .item {
            background: #1f2937;
            border-radius: 14px;
            padding: 0.8rem 1rem;
            border: 1px solid #374151;
            text-align: center;
        }

        .footer .item .val {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f9fafb;
        }

        .footer .item .val.blue { color: #60a5fa; }
        .footer .item .val.green { color: #34d399; }
        .footer .item .val.orange { color: #fbbf24; }
        .footer .item .val.purple { color: #a78bfa; }

        .footer .item .lbl {
            font-size: 0.5rem;
            color: #6b7280;
            text-transform: uppercase;
            margin-top: 0.1rem;
            letter-spacing: 0.3px;
        }

        @media (max-width: 1200px) {
            .routes-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 1024px) {
            .routes-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.6rem;
            }
            .header-left h1 {
                font-size: 1.5rem;
            }
            .routes-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .stats {
                grid-template-columns: 1fr 1fr;
            }
            .footer {
                grid-template-columns: 1fr 1fr;
            }
            .route-details {
                padding: 1.2rem;
            }
            .route-details .route-display {
                flex-direction: column;
                align-items: flex-start;
            }
            .route-details .route-display .response {
                width: 100%;
            }
            .header-right {
                flex-wrap: wrap;
            }
        }

        @media (max-width: 480px) {
            .routes-grid {
                grid-template-columns: 1fr;
            }
            .stats {
                grid-template-columns: 1fr;
            }
            .footer {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <div class="header-left">
                <h1>
                    <i class="fas fa-code"></i>
                    Flask Routes
                    <span class="tag">11 endpoints</span>
                </h1>
                <div class="subtitle">
                    <span><i class="fas fa-arrow-right"></i> Python 3.10</span>
                    <span><i class="fas fa-arrow-right"></i> Flask 2.3.0</span>
                    <span><i class="fas fa-arrow-right"></i> debug mode</span>
                </div>
            </div>
            <div class="header-right">
                <div class="badge"><i class="fas fa-cube"></i> framework <span class="val">Flask</span></div>
                <div class="badge"><i class="fas fa-rocket"></i> <span class="val">11 routes</span></div>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="num blue">11</div>
                <div class="label">Total Routes</div>
            </div>
            <div class="stat">
                <div class="num green">11</div>
                <div class="label">GET Methods</div>
            </div>
            <div class="stat">
                <div class="num orange">1</div>
                <div class="label">Root Route</div>
            </div>
            <div class="stat">
                <div class="num purple">10</div>
                <div class="label">Custom Routes</div>
            </div>
        </div>

        <div class="routes-grid" id="routesGrid"></div>

        <div class="route-details">
            <div class="head">
                <span class="lbl"><i class="fas fa-info-circle"></i> Route Details</span>
                <span class="meta">click any route above</span>
            </div>
            <div class="route-display" id="routeDisplay">
                <span class="method">GET</span>
                <span class="url">/</span>
                <div class="response">
                    <span class="response-text">"Hello, Flask!"</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="item">
                <div class="val blue">11</div>
                <div class="lbl">Endpoints</div>
            </div>
            <div class="item">
                <div class="val green">11</div>
                <div class="lbl">GET Requests</div>
            </div>
            <div class="item">
                <div class="val orange">1</div>
                <div class="lbl">Root Path</div>
            </div>
            <div class="item">
                <div class="val purple">10</div>
                <div class="lbl">Custom Pages</div>
            </div>
        </div>

    </div>

    <script>
        const routes = [
            { number: '01', icon: 'fa-home', name: 'hello', path: '/', response: '"Hello, Flask!"' },
            { number: '02', icon: 'fa-1', name: 'first_page', path: '/first_page', response: '"Hello, this is my first page"' },
            { number: '03', icon: 'fa-2', name: 'second_page', path: '/second_page', response: '"Hello, this is my second page"' },
            { number: '04', icon: 'fa-3', name: 'third_page', path: '/third_page', response: '"Hello and welcome to flask, this is my third flask page"' },
            { number: '05', icon: 'fa-4', name: 'fourth_page', path: '/fourth_page', response: '"Welcome back to flask, this is my fourth flask page"' },
            { number: '06', icon: 'fa-5', name: 'fifth_page', path: '/fifth_page', response: '"Welcome again to flask, this is my fifth flask page"' },
            { number: '07', icon: 'fa-6', name: 'sixth_page', path: '/sixth_page', response: '"Hello and welcome again, nice to meet you in flask, this is my sixth flask page"' },
            { number: '08', icon: 'fa-7', name: 'seventh_page', path: '/seventh_page', response: '"Hey there, how are you? Welcome to Flask. This is my seventh Flask page"' },
            { number: '09', icon: 'fa-8', name: 'eighth_page', path: '/eighth_page', response: '"Hello sir, welcome to Flask, have a nice day, this is my eighth Flask page"' },
            { number: '10', icon: 'fa-9', name: 'ninth_page', path: '/ninth_page', response: '"Hi there, what\'s up today! This is my ninth Flask page"' },
            { number: '11', icon: 'fa-0', name: 'tenth_page', path: '/tenth_page', response: '"Hi, today the weather is perfect. This is my tenth Flask page"' }
        ];

        const grid = document.getElementById('routesGrid');
        routes.forEach((route, index) => {
            const card = document.createElement('div');
            card.className = 'route-card';
            card.setAttribute('data-index', index);
            card.innerHTML = `
                <div class="number">#${route.number}</div>
                <div class="icon"><i class="fas ${route.icon}"></i></div>
                <div class="name">${route.name}</div>
                <div class="path">${route.path}</div>
                <div class="status">● active</div>
            `;
            card.addEventListener('click', function() {
                const idx = parseInt(this.dataset.index);
                displayRoute(idx);
                document.querySelectorAll('.route-card').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
            });
            grid.appendChild(card);
        });

        function displayRoute(index) {
            const route = routes[index];
            const display = document.getElementById('routeDisplay');
            display.innerHTML = `
                <span class="method">GET</span>
                <span class="url">${route.path}</span>
                <div class="response">
                    <span class="response-text">${route.response}</span>
                </div>
            `;
        }

        displayRoute(0);
        const firstCard = document.querySelector('.route-card');
        if (firstCard) {
            firstCard.classList.add('active');
        }
    </script>
</body>
</html>
