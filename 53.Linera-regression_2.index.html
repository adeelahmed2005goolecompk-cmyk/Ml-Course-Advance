<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨ Adeel's Regression Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0a0e1a;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(88, 60, 220, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(220, 60, 180, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(60, 180, 220, 0.08) 0%, transparent 50%);
        }
        .container {
            max-width: 1360px;
            width: 100%;
            background: rgba(10, 14, 30, 0.85);
            backdrop-filter: blur(24px);
            border-radius: 56px;
            padding: 40px 44px 44px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(120, 80, 255, 0.03) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Welcome Banner - CENTERED */
        .welcome-banner {
            text-align: center;
            padding: 18px 30px;
            margin: -10px 0 28px 0;
            background: linear-gradient(135deg, rgba(120, 80, 255, 0.08), rgba(220, 60, 180, 0.06));
            border-radius: 80px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            box-shadow: 0 0 60px rgba(120, 80, 255, 0.05);
        }
        .welcome-banner h2 {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 2.2rem;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #a78bfa, #ec4899, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(167, 139, 250, 0.2);
            animation: glow 3s ease-in-out infinite alternate;
        }
        @keyframes glow {
            0% { filter: drop-shadow(0 0 10px rgba(167, 139, 250, 0.2)); }
            100% { filter: drop-shadow(0 0 30px rgba(236, 72, 153, 0.3)); }
        }
        .welcome-banner .sub-glow {
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #a78bfa, #ec4899, transparent);
            opacity: 0.3;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header-left .icon {
            font-size: 1.8rem;
            line-height: 1;
            filter: drop-shadow(0 0 20px rgba(167, 139, 250, 0.2));
        }
        .header-left h1 {
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: -0.3px;
            color: #e8f0f8;
            font-family: 'Orbitron', monospace;
            font-weight: 600;
        }
        .header-left h1 span {
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-left .badge {
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.2), rgba(236, 72, 153, 0.15));
            border: 1px solid rgba(167, 139, 250, 0.2);
            color: #a78bfa;
            padding: 2px 16px;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            -webkit-text-fill-color: #a78bfa;
            font-family: 'Orbitron', monospace;
        }
        .stats-pills {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .stats-pills .pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 6px 20px 6px 18px;
            border-radius: 60px;
            color: #b0cfe5;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
        }
        .stats-pills .pill strong {
            color: white;
            background: rgba(167, 139, 250, 0.15);
            padding: 0 14px;
            border-radius: 30px;
            font-weight: 600;
        }
        .stats-pills .pill .r2-highlight {
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.2), rgba(236, 72, 153, 0.15));
            color: #c4b5fd;
        }

        /* Chart */
        .chart-wrapper {
            position: relative;
            height: 460px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 32px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 24px;
            transition: 0.4s;
            box-shadow: inset 0 0 60px rgba(167, 139, 250, 0.02);
        }
        .chart-wrapper:hover {
            border-color: rgba(167, 139, 250, 0.15);
            box-shadow: inset 0 0 60px rgba(167, 139, 250, 0.05);
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .equation-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 24px 8px 20px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #cde0ef;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(8px);
        }
        .equation-box .eq-label {
            opacity: 0.5;
            font-weight: 400;
        }
        .equation-box code {
            background: rgba(167, 139, 250, 0.1);
            padding: 4px 18px;
            border-radius: 40px;
            color: #c4b5fd;
            font-weight: 600;
            font-size: 1rem;
            font-family: 'Orbitron', monospace;
            border: 1px solid rgba(167, 139, 250, 0.1);
        }
        .controls-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 14px 4px 16px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .control-group label {
            color: #9cbdd6;
            font-weight: 500;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        .control-group select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(167, 139, 250, 0.15);
            color: white;
            padding: 5px 22px 5px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .control-group select:hover {
            border-color: rgba(167, 139, 250, 0.4);
            background: rgba(167, 139, 250, 0.05);
        }
        .control-group .r2-badge {
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.12), rgba(236, 72, 153, 0.08));
            padding: 2px 14px;
            border-radius: 40px;
            color: #c4b5fd;
            font-weight: 500;
            font-size: 0.75rem;
            border: 1px solid rgba(167, 139, 250, 0.08);
        }
        .slider-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .slider-wrap label {
            color: #9cbdd6;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 500;
        }
        .slider-wrap input[type="range"] {
            width: 80px;
            height: 3px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, rgba(167, 139, 250, 0.3), rgba(236, 72, 153, 0.3));
            border-radius: 4px;
            outline: none;
            transition: 0.3s;
        }
        .slider-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            cursor: pointer;
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.3);
            transition: 0.2s;
        }
        .slider-wrap input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        .slider-wrap input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            cursor: pointer;
            border: none;
        }
        .slider-wrap .zoom-val {
            color: #c4b5fd;
            font-weight: 600;
            min-width: 28px;
            text-align: center;
            font-size: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 0 8px;
            border-radius: 30px;
            font-family: 'Orbitron', monospace;
        }
        .toggle-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toggle-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #b0cfe5;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 30px;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.02);
        }
        .toggle-item:hover {
            background: rgba(167, 139, 250, 0.05);
        }
        .toggle-item input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: #a78bfa;
            cursor: pointer;
            border-radius: 4px;
        }

        @media (max-width: 1000px) {
            .container { padding: 28px; }
            .controls { flex-direction: column; align-items: stretch; }
            .equation-box { justify-content: center; }
            .controls-right { justify-content: center; flex-wrap: wrap; }
            .control-group { flex-wrap: wrap; justify-content: center; }
            .welcome-banner h2 { font-size: 1.4rem; }
        }
        @media (max-width: 600px) {
            .container { padding: 16px; border-radius: 32px; }
            .header { flex-direction: column; align-items: start; }
            .stats-pills .pill { font-size: 0.75rem; padding: 4px 12px; }
            .chart-wrapper { height: 320px; padding: 8px; }
            .welcome-banner { padding: 12px 16px; }
            .welcome-banner h2 { font-size: 1.1rem; letter-spacing: 1px; }
            .header-left h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- WELCOME BANNER - CENTERED -->
    <div class="welcome-banner">
        <h2> Welcome-Mr.Adeel-Ahmed-2026 </h2>
        <div class="sub-glow"></div>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <span class="icon">📊</span>
            <h1><span>regression</span> · studio</h1>
            <span class="badge">● live</span>
        </div>
        <div class="stats-pills">
            <div class="pill">📌 n <strong id="nDisplay">60</strong></div>
            <div class="pill">📈 R² <strong class="r2-highlight" id="r2Display">0.9599</strong></div>
        </div>
    </div>

    <!-- Chart -->
    <div class="chart-wrapper">
        <canvas id="regChart"></canvas>
    </div>

    <!-- Controls -->
    <div class="controls">
        <div class="equation-box">
            <span class="eq-label">📐</span>
            <code id="equationText">y = 7.0785·x + 34.1820</code>
        </div>
        <div class="controls-right">
            <div class="control-group">
                <label for="featureSelect">feature</label>
                <select id="featureSelect">
                    <option value="0">Hours Studied</option>
                    <option value="1">Hours Slept</option>
                </select>
                <span class="r2-badge" id="r2Inline">R² 0.9599</span>
            </div>
            <div class="slider-wrap">
                <label>zoom</label>
                <input type="range" id="zoomSlider" min="0.3" max="2.5" step="0.1" value="1" />
                <span class="zoom-val" id="zoomVal">1.0</span>
            </div>
            <div class="toggle-group">
                <label class="toggle-item">
                    <input type="checkbox" id="showPoints" checked /> ● pts
                </label>
                <label class="toggle-item">
                    <input type="checkbox" id="showLine" checked /> ─ line
                </label>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- DATA: Hours_Studied, Hours_Slept, Exam_Score ----------
        const raw = [
            [1.2, 5.1, 38.7], [1.8, 5.8, 45.2], [2.3, 4.2, 44.5],
            [2.9, 6.3, 54.1], [3.4, 5.9, 57.8], [4.0, 7.2, 68.4],
            [4.5, 6.8, 70.2], [5.1, 5.5, 68.9], [5.6, 8.1, 78.5],
            [6.2, 7.5, 82.1], [6.7, 6.2, 79.8], [7.3, 7.8, 88.4],
            [7.8, 8.5, 93.2], [8.4, 6.9, 90.5], [8.9, 8.2, 96.8],
            [9.5, 7.1, 94.1], [1.5, 4.8, 40.3], [2.1, 6.1, 49.8],
            [2.8, 5.2, 50.6], [3.3, 7.4, 61.2], [3.9, 6.5, 63.9],
            [4.6, 5.8, 66.7], [5.2, 7.9, 76.4], [5.8, 6.3, 74.8],
            [6.3, 8.3, 84.2], [6.9, 7.6, 86.9], [7.4, 6.7, 83.5],
            [8.0, 8.0, 92.7], [8.6, 7.3, 91.3], [9.1, 8.6, 97.5],
            [9.7, 7.9, 95.8], [1.1, 5.4, 37.9], [1.7, 4.5, 39.8],
            [2.4, 6.9, 52.4], [3.0, 5.6, 53.7], [3.6, 7.1, 63.5],
            [4.2, 6.2, 64.8], [4.8, 8.0, 74.9], [5.4, 7.2, 76.3],
            [6.0, 6.8, 79.1], [6.6, 8.4, 86.5], [7.2, 7.3, 85.2],
            [7.9, 8.1, 92.1], [8.5, 7.6, 91.8], [9.2, 8.7, 97.9],
            [1.4, 5.0, 39.5], [2.0, 5.9, 47.8], [2.6, 4.8, 46.2],
            [3.2, 6.7, 57.5], [3.8, 6.4, 61.8], [4.4, 7.5, 70.8],
            [5.0, 6.1, 68.1], [5.7, 8.2, 78.9], [6.3, 7.0, 80.5],
            [6.9, 8.0, 86.8], [7.5, 7.7, 88.5], [8.1, 7.4, 89.8],
            [8.7, 8.3, 94.6], [9.3, 7.8, 94.3], [9.9, 8.5, 99.2]
        ];

        // DOM refs
        const canvas = document.getElementById('regChart');
        const ctx = canvas.getContext('2d');
        const eqText = document.getElementById('equationText');
        const r2Display = document.getElementById('r2Display');
        const r2Inline = document.getElementById('r2Inline');
        const nDisplay = document.getElementById('nDisplay');
        const featureSelect = document.getElementById('featureSelect');
        const zoomSlider = document.getElementById('zoomSlider');
        const zoomVal = document.getElementById('zoomVal');
        const showPointsCb = document.getElementById('showPoints');
        const showLineCb = document.getElementById('showLine');

        // Regression calculator
        function calcRegression(xArr, yArr) {
            const n = xArr.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
            for (let i = 0; i < n; i++) {
                sumX += xArr[i];
                sumY += yArr[i];
                sumXY += xArr[i] * yArr[i];
                sumX2 += xArr[i] * xArr[i];
            }
            const meanX = sumX / n;
            const meanY = sumY / n;
            const slope = (sumXY - n * meanX * meanY) / (sumX2 - n * meanX * meanX);
            const intercept = meanY - slope * meanX;
            let ssTot = 0, ssRes = 0;
            for (let i = 0; i < n; i++) {
                ssTot += (yArr[i] - meanY) ** 2;
                ssRes += (yArr[i] - (intercept + slope * xArr[i])) ** 2;
            }
            const r2 = 1 - (ssRes / ssTot);
            return { slope, intercept, r2 };
        }

        function getData(featureIdx) {
            const x = raw.map(row => row[featureIdx]);
            const y = raw.map(row => row[2]);
            const { slope, intercept, r2 } = calcRegression(x, y);
            return { x, y, slope, intercept, r2 };
        }

        let chart = null;

        function render() {
            const featureIdx = parseInt(featureSelect.value);
            const { x, y, slope, intercept, r2 } = getData(featureIdx);
            const zoom = parseFloat(zoomSlider.value);
            const showPoints = showPointsCb.checked;
            const showLine = showLineCb.checked;

            nDisplay.textContent = x.length;
            const r2Str = r2.toFixed(4);
            r2Display.textContent = r2Str;
            r2Inline.textContent = `R² ${r2Str}`;
            eqText.innerHTML = `y = ${slope.toFixed(4)}·x + ${intercept.toFixed(4)}`;

            const scatterData = x.map((xi, i) => ({ x: xi, y: y[i] }));
            const xMin = Math.min(...x) - 0.5;
            const xMax = Math.max(...x) + 0.5;
            const lineData = [
                { x: xMin, y: slope * xMin + intercept },
                { x: xMax, y: slope * xMax + intercept }
            ];

            if (chart) { chart.destroy(); chart = null; }

            const datasets = [];
            if (showPoints) {
                datasets.push({
                    label: featureIdx === 0 ? 'Hours Studied' : 'Hours Slept',
                    data: scatterData,
                    backgroundColor: 'rgba(167, 139, 250, 0.6)',
                    borderColor: '#a78bfa',
                    borderWidth: 1.5,
                    pointRadius: 5,
                    pointHoverRadius: 10,
                    showLine: false,
                    order: 1
                });
            }
            if (showLine) {
                datasets.push({
                    label: 'Regression',
                    data: lineData,
                    type: 'line',
                    borderColor: '#ec4899',
                    borderWidth: 3.5,
                    pointRadius: 0,
                    fill: false,
                    tension: 0,
                    order: 0,
                    showLine: true,
                    backgroundColor: 'transparent',
                    borderDash: [8, 5],
                });
            }

            chart = new Chart(ctx, {
                type: 'scatter',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'nearest', intersect: false },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#cde0ef',
                                font: { size: 11, weight: '500', family: 'Inter' },
                                boxWidth: 12,
                                padding: 14
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(10, 14, 30, 0.95)',
                            titleColor: '#e8f0f8',
                            bodyColor: '#c4b5fd',
                            borderColor: 'rgba(167, 139, 250, 0.2)',
                            borderWidth: 1,
                            padding: 12,
                            callbacks: {
                                label: (ctx) => {
                                    if (ctx.dataset.label === 'Regression') return '';
                                    return `( ${ctx.raw.x.toFixed(2)} , ${ctx.raw.y.toFixed(2)} )`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            title: {
                                display: true,
                                text: featureIdx === 0 ? 'Hours Studied' : 'Hours Slept',
                                color: '#9cbdd6',
                                font: { size: 12, weight: '500', family: 'Inter' }
                            },
                            grid: { color: 'rgba(255,255,255,0.03)' },
                            ticks: { color: '#acc6db' },
                            min: 0.5 * zoom,
                            max: 10.5 * zoom,
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Exam Score',
                                color: '#9cbdd6',
                                font: { size: 12, weight: '500', family: 'Inter' }
                            },
                            grid: { color: 'rgba(255,255,255,0.03)' },
                            ticks: { color: '#acc6db' },
                            min: 30 * zoom,
                            max: 105 * zoom,
                        }
                    }
                }
            });
        }

        featureSelect.addEventListener('change', render);
        zoomSlider.addEventListener('input', function() {
            zoomVal.textContent = this.value;
            render();
        });
        showPointsCb.addEventListener('change', render);
        showLineCb.addEventListener('change', render);

        render();
        window.__reg = { raw, render };
    })();
</script>
</body>
</html>
