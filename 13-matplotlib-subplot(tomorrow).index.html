<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subplot · tomorrow</title>
  <!-- Chart.js (lightweight & beautiful) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Font Awesome for subtle icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f0f5fb 0%, #e2edf5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 2rem 1.5rem;
    }

    /* main card – glassmorphism */
    .dashboard {
      max-width: 1200px;
      width: 100%;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 56px;
      box-shadow: 0 30px 70px rgba(10, 30, 50, 0.12), 0 12px 30px rgba(0, 0, 0, 0.04), inset 0 1px 2px rgba(255, 255, 255, 0.7);
      padding: 2.8rem 2.8rem 3rem;
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: all 0.2s;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(40, 80, 120, 0.08);
      padding-bottom: 1.2rem;
    }

    .title-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .title-group h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #1a3f5c, #2d6b8a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-group h1 small {
      font-size: 1rem;
      font-weight: 400;
      background: rgba(40, 80, 120, 0.10);
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      color: #1f4a6a;
      letter-spacing: 0.3px;
      background-clip: unset;
      -webkit-background-clip: unset;
    }

    .subtitle {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 24px;
      color: #1f4a66;
      font-weight: 450;
      font-size: 0.95rem;
      opacity: 0.85;
    }

    .subtitle span {
      background: rgba(40, 80, 120, 0.06);
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid rgba(60, 110, 160, 0.06);
    }

    .data-badge {
      background: rgba(20, 60, 100, 0.05);
      padding: 0.3rem 1.5rem;
      border-radius: 60px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid rgba(70, 130, 180, 0.08);
      backdrop-filter: blur(4px);
      font-size: 0.85rem;
      color: #1f4d6b;
    }

    .data-badge i {
      color: #2f7d9e;
    }

    .color-dots {
      display: flex;
      gap: 10px;
    }

    .color-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    /* subplot grid: two columns */
    .subplot-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.8rem;
      margin: 1.2rem 0 2.2rem;
    }

    .chart-card {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      border-radius: 32px;
      padding: 1.5rem 1.2rem 1rem 1.2rem;
      box-shadow: 0 8px 20px rgba(10, 30, 50, 0.04), inset 0 1px 0 rgba(255,255,255,0.8);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: transform 0.15s ease, box-shadow 0.2s;
    }

    .chart-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 30px -10px rgba(20, 50, 80, 0.08);
    }

    .chart-card .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.2rem 0.6rem 0.2rem;
      border-bottom: 1px dashed rgba(40, 80, 120, 0.08);
      margin-bottom: 0.8rem;
    }

    .chart-card .card-header .label {
      font-weight: 550;
      color: #1b405a;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chart-card .card-header .label i {
      opacity: 0.6;
      font-size: 0.9rem;
      color: #336e8c;
    }

    .chart-card canvas {
      width: 100% !important;
      max-height: 220px;
      height: 210px !important;
    }

    /* legend / info row */
    .info-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: rgba(240, 248, 255, 0.4);
      backdrop-filter: blur(4px);
      padding: 1.2rem 2rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      margin-top: 1rem;
    }

    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem 2.5rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 450;
      color: #1e4360;
    }

    .legend-swatch {
      width: 18px;
      height: 18px;
      border-radius: 30px;
      background: #2a7d9e;
    }

    .legend-swatch.s1 { background: #2a7d9e; }
    .legend-swatch.s2 { background: #d97747; }
    .legend-swatch.s3 { background: #4d8f7a; }

    .subplot-hint {
      font-size: 0.85rem;
      color: #2d5b78;
      background: rgba(40, 80, 120, 0.04);
      padding: 0.2rem 1.2rem;
      border-radius: 60px;
      border: 1px solid rgba(60, 110, 160, 0.06);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subplot-hint i {
      opacity: 0.7;
    }

    @media (max-width: 800px) {
      .dashboard { padding: 1.8rem; }
      .subplot-grid { grid-template-columns: 1fr; gap: 1.5rem; }
      .header { flex-direction: column; align-items: flex-start; gap: 0.6rem; }
      .info-footer { flex-direction: column; align-items: flex-start; gap: 0.8rem; border-radius: 40px; }
    }

    @media (max-width: 480px) {
      .title-group h1 { font-size: 1.6rem; flex-wrap: wrap; }
      .data-badge { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
<div class="dashboard">

  <!-- header -->
  <div class="header">
    <div class="title-group">
      <h1>
        <i class="fas fa-layer-group" style="font-size: 1.8rem; color: #2b6b8a; opacity: 0.7;"></i>
        subplot · tomorrow
        <small>1×2</small>
      </h1>
      <div class="subtitle">
        <span><i class="fas fa-arrow-right" style="margin-right: 4px;"></i> value1 (1–6)</span>
        <span><i class="fas fa-arrow-right" style="margin-right: 4px;"></i> value2 (1,2,3,4,5,60)</span>
        <span><i class="fas fa-arrow-right" style="margin-right: 4px;"></i> value3 (11,22,33,44,55,66)</span>
      </div>
    </div>
    <div class="data-badge">
      <i class="fas fa-chart-line"></i>
      <span>3 series</span>
      <span class="color-dots">
        <span class="color-dot" style="background: #2a7d9e;"></span>
        <span class="color-dot" style="background: #d97747;"></span>
        <span class="color-dot" style="background: #4d8f7a;"></span>
      </span>
    </div>
  </div>

  <!-- subplot grid : two charts side by side -->
  <div class="subplot-grid">
    <!-- left chart : subplot(1,2,1) -->
    <div class="chart-card">
      <div class="card-header">
        <span class="label"><i class="fas fa-arrow-left"></i> subplot(1,2,1) · value1 & value2</span>
        <span style="font-size: 0.7rem; background: rgba(40,80,120,0.05); padding: 0.2rem 0.8rem; border-radius: 40px; color: #2b5b78;"><i class="far fa-circle"></i> 6 pts</span>
      </div>
      <canvas id="subplotLeft"></canvas>
    </div>

    <!-- right chart : subplot(1,2,2) -->
    <div class="chart-card">
      <div class="card-header">
        <span class="label"><i class="fas fa-arrow-right"></i> subplot(1,2,2) · value1 & value3</span>
        <span style="font-size: 0.7rem; background: rgba(40,80,120,0.05); padding: 0.2rem 0.8rem; border-radius: 40px; color: #2b5b78;"><i class="far fa-circle"></i> 6 pts</span>
      </div>
      <canvas id="subplotRight"></canvas>
    </div>
  </div>

  <!-- info footer -->
  <div class="info-footer">
    <div class="legend-items">
      <div class="legend-item"><span class="legend-swatch s1"></span> value1 (x)</div>
      <div class="legend-item"><span class="legend-swatch s2"></span> value2 (y1)</div>
      <div class="legend-item"><span class="legend-swatch s3"></span> value3 (y2)</div>
    </div>
    <div class="subplot-hint">
      <i class="fas fa-vector-square"></i> 
      <span>grid: off · clean style</span>
      <i class="fas fa-chevron-right" style="opacity: 0.3; font-size: 0.7rem;"></i>
    </div>
  </div>
</div>

<script>
  (function() {
    // ----- data from your python script -----
    const value1 = [1, 2, 3, 4, 5, 6];
    const value2 = [1, 2, 3, 4, 5, 60];
    const value3 = [11, 22, 33, 44, 55, 66];

    // ----- helper to build dataset for scatter (points) -----
    function buildScatterData(xVals, yVals, color, label) {
      return {
        label: label,
        data: xVals.map((x, i) => ({ x: x, y: yVals[i] })),
        backgroundColor: color,
        borderColor: color,
        borderWidth: 1.2,
        pointRadius: 6,
        pointHoverRadius: 9,
        pointBorderColor: 'white',
        pointBorderWidth: 1.5,
        showLine: false,
        tension: 0.1,
      };
    }

    // ----- left chart : subplot(1,2,1) value1 vs value2 -----
    const ctxLeft = document.getElementById('subplotLeft').getContext('2d');
    new Chart(ctxLeft, {
      type: 'scatter',
      data: {
        datasets: [
          buildScatterData(value1, value2, '#2a7d9e', 'value2'),
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(20, 40, 60, 0.85)',
            titleColor: '#e3f0fa',
            bodyColor: '#cfe2f0',
            cornerRadius: 16,
            padding: 10,
            callbacks: {
              label: (ctx) => ` (${ctx.raw.x}, ${ctx.raw.y})`
            }
          }
        },
        scales: {
          x: {
            min: 0.5, max: 6.8,
            grid: { display: false },
            ticks: { stepSize: 1, color: '#1d4057', font: { size: 11 } },
            title: { display: true, text: 'value1', color: '#1a405a', font: { size: 12, weight: '500' } }
          },
          y: {
            min: -2, max: 68,
            grid: { display: false },
            ticks: { stepSize: 10, color: '#1d4057', font: { size: 11 } },
            title: { display: true, text: 'value2', color: '#1a405a', font: { size: 12, weight: '500' } }
          }
        },
        layout: { padding: { top: 10, bottom: 6, left: 6, right: 10 } }
      }
    });

    // ----- right chart : subplot(1,2,2) value1 vs value3 -----
    const ctxRight = document.getElementById('subplotRight').getContext('2d');
    new Chart(ctxRight, {
      type: 'scatter',
      data: {
        datasets: [
          buildScatterData(value1, value3, '#4d8f7a', 'value3'),
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(20, 40, 60, 0.85)',
            titleColor: '#e3f0fa',
            bodyColor: '#cfe2f0',
            cornerRadius: 16,
            padding: 10,
            callbacks: {
              label: (ctx) => ` (${ctx.raw.x}, ${ctx.raw.y})`
            }
          }
        },
        scales: {
          x: {
            min: 0.5, max: 6.8,
            grid: { display: false },
            ticks: { stepSize: 1, color: '#1d4057', font: { size: 11 } },
            title: { display: true, text: 'value1', color: '#1a405a', font: { size: 12, weight: '500' } }
          },
          y: {
            min: 5, max: 75,
            grid: { display: false },
            ticks: { stepSize: 11, color: '#1d4057', font: { size: 11 } },
            title: { display: true, text: 'value3', color: '#1a405a', font: { size: 12, weight: '500' } }
          }
        },
        layout: { padding: { top: 10, bottom: 6, left: 6, right: 10 } }
      }
    });

  })();
</script>
</body>
</html>
