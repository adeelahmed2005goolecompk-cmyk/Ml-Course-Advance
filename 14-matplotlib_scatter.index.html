<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scatter · multi‑dataset</title>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f3f7fc 0%, #e3edf6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 2rem 1.5rem;
    }

    /* main container */
    .scatter-dash {
      max-width: 1300px;
      width: 100%;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 56px;
      box-shadow: 0 30px 70px rgba(10, 30, 50, 0.10), 0 12px 28px rgba(0,0,0,0.03), inset 0 1px 2px rgba(255,255,255,0.6);
      padding: 2.6rem 2.6rem 3rem;
      border: 1px solid rgba(255,255,255,0.4);
      transition: all 0.2s;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid rgba(40, 80, 120, 0.06);
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .title-block h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #1a3f5c, #2d6b8a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .title-block h1 small {
      font-size: 1rem;
      font-weight: 400;
      background: rgba(40, 80, 120, 0.08);
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      color: #1f4a6a;
      letter-spacing: 0.2px;
      background-clip: unset;
      -webkit-background-clip: unset;
    }

    .subtitle {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      color: #1f4a66;
      font-weight: 450;
      font-size: 0.9rem;
    }

    .subtitle span {
      background: rgba(40, 80, 120, 0.05);
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      border: 1px solid rgba(60, 110, 160, 0.04);
    }

    .badge-set {
      display: flex;
      align-items: center;
      gap: 18px;
      background: rgba(20, 60, 100, 0.03);
      padding: 0.3rem 1.5rem;
      border-radius: 60px;
      border: 1px solid rgba(70, 130, 180, 0.06);
      flex-wrap: wrap;
    }

    .badge-set .dot-group {
      display: flex;
      gap: 8px;
    }

    .dot-badge {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 30px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    /* chart grid */
    .chart-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin: 1.5rem 0 2.2rem;
    }

    .chart-card {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      border-radius: 32px;
      padding: 1.5rem 1.2rem 1rem 1.2rem;
      box-shadow: 0 8px 20px rgba(10, 30, 50, 0.03), inset 0 1px 0 rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.5);
      transition: transform 0.15s ease, box-shadow 0.2s;
    }

    .chart-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 30px -8px rgba(20, 50, 80, 0.06);
    }

    .chart-card .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.2rem 0.6rem 0.2rem;
      border-bottom: 1px dashed rgba(40, 80, 120, 0.06);
      margin-bottom: 0.6rem;
    }

    .chart-card .card-head .label {
      font-weight: 550;
      color: #1a405a;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chart-card .card-head .label i {
      opacity: 0.5;
      font-size: 0.9rem;
    }

    .chart-card canvas {
      width: 100% !important;
      max-height: 240px;
      height: 220px !important;
    }

    /* footer / legend + controls */
    .footer-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: rgba(240, 248, 255, 0.4);
      backdrop-filter: blur(4px);
      padding: 1.2rem 2rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      margin-top: 0.6rem;
      gap: 1rem;
    }

    .legend-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1.8rem 2.8rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 450;
      color: #1e4360;
      cursor: pointer;
      user-select: none;
      transition: 0.15s;
    }

    .legend-item .swatch {
      width: 18px;
      height: 18px;
      border-radius: 30px;
      transition: 0.2s;
    }

    .legend-item .swatch.s1 { background: #2a7d9e; }
    .legend-item .swatch.s2 { background: #d97747; }
    .legend-item .swatch.s3 { background: #4d8f7a; }
    .legend-item .swatch.s4 { background: #b34d6e; }
    .legend-item .swatch.s5 { background: #6b8f9e; }

    .legend-item .legend-label {
      font-size: 0.85rem;
    }

    .legend-item .legend-label small {
      font-weight: 350;
      opacity: 0.6;
      font-size: 0.75rem;
      margin-left: 2px;
    }

    .toggle-hint {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      color: #2d5b78;
      background: rgba(40, 80, 120, 0.03);
      padding: 0.2rem 1.2rem;
      border-radius: 60px;
      border: 1px solid rgba(60, 110, 160, 0.04);
    }

    .toggle-hint i {
      opacity: 0.6;
    }

    .legend-item.hidden-dataset {
      opacity: 0.35;
    }

    .legend-item.hidden-dataset .swatch {
      opacity: 0.3;
    }

    @media (max-width: 900px) {
      .chart-grid { grid-template-columns: 1fr; gap: 1.5rem; }
    }

    @media (max-width: 650px) {
      .scatter-dash { padding: 1.5rem; }
      .header { flex-direction: column; align-items: flex-start; gap: 0.6rem; }
      .footer-panel { flex-direction: column; align-items: stretch; border-radius: 40px; padding: 1.2rem; }
      .legend-group { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="scatter-dash">

  <!-- header -->
  <div class="header">
    <div class="title-block">
      <h1>
        <i class="fas fa-circle-dot" style="font-size: 1.8rem; color: #2b6b8a; opacity: 0.6;"></i>
        scatter · matrix
        <small>3 datasets</small>
      </h1>
      <div class="subtitle">
        <span><i class="fas fa-arrow-right" style="margin-right: 4px;"></i> week1 / week2</span>
        <span><i class="fas fa-arrow-right" style="margin-right: 4px;"></i> speed_1 / speed_2</span>
        <span><i class="fas fa-arrow-right" style="margin-right: 4px;"></i> data1–3 · age</span>
      </div>
    </div>
    <div class="badge-set">
      <span style="font-size: 0.85rem; font-weight: 500; color: #1f4d6b;"><i class="far fa-circle"></i> 3 views</span>
      <span class="dot-group">
        <span class="dot-badge" style="background: #2a7d9e;"></span>
        <span class="dot-badge" style="background: #d97747;"></span>
        <span class="dot-badge" style="background: #4d8f7a;"></span>
        <span class="dot-badge" style="background: #b34d6e;"></span>
      </span>
    </div>
  </div>

  <!-- chart grid: two rows? actually 3 charts but we put 2+1 with a span -->
  <div class="chart-grid">
    <!-- chart 1: week1 vs speed1 & week2 vs speed2 -->
    <div class="chart-card">
      <div class="card-head">
        <span class="label"><i class="fas fa-calendar-week"></i> week vs speed (1 & 2)</span>
        <span style="font-size: 0.7rem; background: rgba(40,80,120,0.04); padding: 0.2rem 0.8rem; border-radius: 40px; color: #2b5b78;"><i class="far fa-clock"></i> 7 pts each</span>
      </div>
      <canvas id="chartSpeed"></canvas>
    </div>

    <!-- chart 2: data1, data2, data3 vs age -->
    <div class="chart-card">
      <div class="card-head">
        <span class="label"><i class="fas fa-chart-simple"></i> data1–3 vs age</span>
        <span style="font-size: 0.7rem; background: rgba(40,80,120,0.04); padding: 0.2rem 0.8rem; border-radius: 40px; color: #2b5b78;"><i class="far fa-circle"></i> 5 pts each</span>
      </div>
      <canvas id="chartData"></canvas>
    </div>
  </div>

  <!-- footer : legend + toggle (click on legend to hide/show) -->
  <div class="footer-panel">
    <div class="legend-group" id="legendContainer">
      <!-- dynamically built by js -->
    </div>
    <div class="toggle-hint">
      <i class="fas fa-arrow-pointer"></i> 
      <span>click legend to toggle</span>
    </div>
  </div>
</div>

<script>
  (function() {
    // ----- data from your python script -----
    const week1 = [1, 2, 3, 4, 5, 6, 7];
    const speed1 = [20, 30, 40, 50, 60, 70, 80];
    const week2 = [1, 2, 3, 4, 5, 6, 7];
    const speed2 = [10, 20, 30, 40, 50, 60, 70];

    const data1 = [50, 60, 70, 76, 68];
    const data2 = [20, 10, 24, 22, 14];
    const data3 = [90, 99, 98, 95, 96];
    const age = [18, 19, 20, 17, 16];

    // ----- helper: build scatter dataset -----
    function makeScatter(xVals, yVals, color, label, pointRadius = 6) {
      return {
        label: label,
        data: xVals.map((x, i) => ({ x: x, y: yVals[i] })),
        backgroundColor: color,
        borderColor: color,
        borderWidth: 1.2,
        pointRadius: pointRadius,
        pointHoverRadius: 10,
        pointBorderColor: 'white',
        pointBorderWidth: 1.5,
        showLine: false,
        tension: 0,
      };
    }

    // ---------- CHART 1 : speed (week1/speed1 + week2/speed2) ----------
    const ctxSpeed = document.getElementById('chartSpeed').getContext('2d');
    const speedChart = new Chart(ctxSpeed, {
      type: 'scatter',
      data: {
        datasets: [
          makeScatter(week1, speed1, '#2a7d9e', 'week1 · speed1', 6),
          makeScatter(week2, speed2, '#d97747', 'week2 · speed2', 6),
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(20, 40, 60, 0.85)',
            titleColor: '#e3f0fa',
            bodyColor: '#cfe2f0',
            cornerRadius: 16,
            padding: 10,
            callbacks: {
              label: (ctx) => ` (${ctx.raw.x}, ${ctx.raw.y})`
            }
          }
        },
        scales: {
          x: {
            min: 0.5, max: 8,
            grid: { display: false },
            ticks: { stepSize: 1, color: '#1d4057', font: { size: 11 } },
            title: { display: true, text: 'week', color: '#1a405a', font: { size: 12, weight: '500' } }
          },
          y: {
            min: 0, max: 90,
            grid: { display: false },
            ticks: { stepSize: 20, color: '#1d4057', font: { size: 11 } },
            title: { display: true, text: 'speed', color: '#1a405a', font: { size: 12, weight: '500' } }
          }
        },
        layout: { padding: { top: 10, bottom: 6, left: 6, right: 10 } }
      }
    });

    // ---------- CHART 2 : data1, data2, data3 vs age ----------
    const ctxData = document.getElementById('chartData').getContext('2d');
    const dataChart = new Chart(ctxData, {
      type: 'scatter',
      data: {
        datasets: [
          makeScatter(data1, age, '#4d8f7a', 'data1 · age', 6),
          makeScatter(data2, age, '#b34d6e', 'data2 · age', 6),
          makeScatter(data3, age, '#6b8f9e', 'data3 · age', 6),
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(20, 40, 60, 0.85)',
            titleColor: '#e3f0fa',
            bodyColor: '#cfe2f0',
            cornerRadius: 16,
            padding: 10,
            callbacks: {
              label: (ctx) => ` (${ctx.raw.x}, ${ctx.raw.y})`
            }
          }
        },
        scales: {
          x: {
            min: 10, max: 105,
            grid: { display: false },
            ticks: { stepSize: 20, color: '#1d4057', font: { size: 11 } },
            title: { display: true, text: 'data value', color: '#1a405a', font: { size: 12, weight: '500' } }
          },
          y: {
            min: 14, max: 22,
            grid: { display: false },
            ticks: { stepSize: 1, color: '#1d4057', font: { size: 11 } },
            title: { display: true, text: 'age', color: '#1a405a', font: { size: 12, weight: '500' } }
          }
        },
        layout: { padding: { top: 10, bottom: 6, left: 6, right: 10 } }
      }
    });

    // ----- combine all datasets from both charts for legend toggling -----
    const allDatasets = [...speedChart.data.datasets, ...dataChart.data.datasets];

    // ----- build legend dynamically -----
    const legendContainer = document.getElementById('legendContainer');
    // color map for swatches (use same colors)
    const colorMap = {
      'week1 · speed1': '#2a7d9e',
      'week2 · speed2': '#d97747',
      'data1 · age': '#4d8f7a',
      'data2 · age': '#b34d6e',
      'data3 · age': '#6b8f9e'
    };

    // create legend items
    allDatasets.forEach((ds, index) => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      const label = ds.label || `dataset ${index+1}`;
      const color = colorMap[label] || '#888';

      item.innerHTML = `
        <span class="swatch" style="background: ${color};"></span>
        <span class="legend-label">${label} <small>· ${ds.data.length} pts</small></span>
      `;
      // store dataset reference
      item.dataset.datasetIndex = index;
      item.dataset.chartId = index < 2 ? 'speed' : 'data';

      // click to toggle visibility
      item.addEventListener('click', function(e) {
        const idx = parseInt(this.dataset.datasetIndex);
        let targetDs;
        if (idx < 2) {
          targetDs = speedChart.data.datasets[idx];
        } else {
          const dataIdx = idx - 2;
          targetDs = dataChart.data.datasets[dataIdx];
        }
        if (!targetDs) return;

        // toggle hidden
        targetDs.hidden = !targetDs.hidden;
        // update both charts
        speedChart.update();
        dataChart.update();

        // toggle class on legend item for visual feedback
        this.classList.toggle('hidden-dataset');
      });

      legendContainer.appendChild(item);
    });

    // small: add a subtle "all visible" state initially
    // ensure all datasets are visible
    allDatasets.forEach(ds => ds.hidden = false);
    speedChart.update();
    dataChart.update();

    // add a small resize handler
    window.addEventListener('resize', () => {
      speedChart.update();
      dataChart.update();
    });

  })();
</script>
</body>
</html>
